# URCC HAL Rust build configuration.
#
# The aarch64 linker and link arguments are supplied by build_rust.sh through
# CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER and
# CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS, derived from ANDROID_NDK_HOME
# and ROM_TREE / LIBBINDER_NDK. This keeps machine-specific paths out of the
# repository.

[build]
target-dir = "target"
